name: Release Native Libraries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (defaults to v<Cargo.toml version>, e.g. v0.3.1)'
        required: false
        default: ''
        type: string
      upstream_ref:
        description: 'google-ai-edge/LiteRT-LM commit SHA (defaults to c/UPSTREAM_COMMIT)'
        required: false
        default: ''
        type: string
      force_rebuild:
        description: 'Force clean C++ rebuild instead of reusing verified Limrun Asset Storage archive'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      force_rebuild: ${{ steps.resolve.outputs.force_rebuild }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release and upstream metadata
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_UPSTREAM_REF: ${{ inputs.upstream_ref }}
          INPUT_FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail
          CARGO_VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="v${CARGO_VER}"
          fi
          VERSION="${TAG#v}"
          if [[ -n "${INPUT_UPSTREAM_REF}" ]]; then
            UPSTREAM_REF="${INPUT_UPSTREAM_REF}"
          else
            UPSTREAM_REF="$(tr -d ' \n\r' < c/UPSTREAM_COMMIT)"
          fi
          FORCE_REBUILD="${INPUT_FORCE_REBUILD:-false}"
          COMMIT_SHA="$(git rev-parse HEAD)"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "upstream_ref=${UPSTREAM_REF}"
            echo "commit_sha=${COMMIT_SHA}"
            echo "force_rebuild=${FORCE_REBUILD}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved release tag=${TAG}, version=${VERSION}, upstream=${UPSTREAM_REF}, force_rebuild=${FORCE_REBUILD}"

  build-linux-x86_64:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64

      - name: Install and authenticate Limrun CLI
        env:
          LIM_API_KEY: ${{ secrets.LIM_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${LIM_API_KEY:-}" ]]; then
            echo "::error::Missing LIM_API_KEY repository secret."
            exit 1
          fi
          npm install -g lim --no-audit --no-fund
          lim set-api-key "$LIM_API_KEY" >/dev/null
          lim version

      - name: Check Limrun Asset Storage for cached Linux archive
        id: cache_check
        run: |
          set -euo pipefail
          UPSTREAM_REF="${{ needs.meta.outputs.upstream_ref }}"
          SHORT_REF="${UPSTREAM_REF:0:12}"
          FORCE_REBUILD="${{ needs.meta.outputs.force_rebuild }}"
          ASSET_NAME="litert-lm-linux-x86_64-${SHORT_REF}.tar.gz"
          SHA_ASSET_NAME="${ASSET_NAME}.sha256"
          mkdir -p /tmp/pulled
          HIT="false"
          if [[ "$FORCE_REBUILD" != "true" ]]; then
            ASSET_ID="$(lim asset list --name "$ASSET_NAME" --json 2>/dev/null | node -e '
              const items = JSON.parse(require("fs").readFileSync(0, "utf8") || "[]");
              process.stdout.write(items[0]?.id || "");
            ' || true)"
            if [[ -n "$ASSET_ID" ]] && lim asset pull "$ASSET_ID" -o /tmp/pulled >/dev/null; then
              SHA_ID="$(lim asset list --name "$SHA_ASSET_NAME" --json 2>/dev/null | node -e '
                const items = JSON.parse(require("fs").readFileSync(0, "utf8") || "[]");
                process.stdout.write(items[0]?.id || "");
              ' || true)"
              VALID=1
              if [[ -n "$SHA_ID" ]] && lim asset pull "$SHA_ID" -o /tmp/pulled >/dev/null 2>&1; then
                EXPECTED="$(awk '{print tolower($1)}' "/tmp/pulled/$SHA_ASSET_NAME")"
                ACTUAL="$(sha256sum "/tmp/pulled/$ASSET_NAME" | awk '{print $1}')"
                [[ "$EXPECTED" == "$ACTUAL" ]] || VALID=0
              fi
              if [[ "$VALID" -eq 1 ]]; then
                cp -f "/tmp/pulled/$ASSET_NAME" /tmp/pulled/litert-lm-out.tar.gz
                HIT="true"
                echo "Restored verified Linux archive from Limrun Asset Storage ($ASSET_NAME, $ASSET_ID)"
              fi
            fi
          fi
          echo "hit=${HIT}" >> "$GITHUB_OUTPUT"

      - name: Create ephemeral 96-vCPU Limrun Linux sandbox
        id: sandbox
        if: steps.cache_check.outputs.hit != 'true'
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          UPSTREAM_REF="${{ needs.meta.outputs.upstream_ref }}"
          SHORT_REF="${UPSTREAM_REF:0:8}"
          mkdir -p /tmp/lim-ws
          printf 'rootProject.name = "litert-lm-ci"\n' > /tmp/lim-ws/settings.gradle
          SANDBOX_JSON="$(lim gradle create --display-name "litert-lm-${TAG}-${SHORT_REF}" --inactivity-timeout 30m --hard-timeout 90m --label "repo=litert-lm-rust" --json)"
          SANDBOX_ID="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).metadata.id)' <<<"$SANDBOX_JSON")"
          echo "id=${SANDBOX_ID}" >> "$GITHUB_OUTPUT"
          env -C /tmp/lim-ws lim gradle sync --id "$SANDBOX_ID" >/dev/null

      - name: Build portable LiteRT-LM C API shared libraries on Limrun
        if: steps.cache_check.outputs.hit != 'true'
        run: |
          set -euo pipefail
          SANDBOX_ID="${{ steps.sandbox.outputs.id }}"
          TAG="${{ needs.meta.outputs.tag }}"
          COMMIT_SHA="${{ needs.meta.outputs.commit_sha }}"
          UPSTREAM_REF="${{ needs.meta.outputs.upstream_ref }}"
          SHORT_REF="${UPSTREAM_REF:0:12}"
          UPSTREAM_REPO="https://github.com/google-ai-edge/LiteRT-LM.git"

          CACHE_TOKEN="$(lim access-token create --permission 'remotecache:*:all' --permission 'remoteexecution:*:all' --ttl-seconds 7200 --quiet || true)"
          SETUP_JSON="$(node -e '
            try {
              const path = require("path"), cp = require("child_process");
              const limRoot = path.join(cp.execSync("npm root -g", { encoding: "utf8" }).trim(), "lim");
              const Limrun = require(path.join(limRoot, "node_modules/@limrun/api")).default;
              const { readConfig } = require(path.join(limRoot, "dist/lib/config"));
              const { getBazelSetup } = require(path.join(limRoot, "dist/lib/bazel-setup"));
              const cfg = readConfig();
              const client = new Limrun({ apiKey: cfg.apiKey, baseURL: cfg.apiEndpoint });
              getBazelSetup(client).then(j => process.stdout.write(JSON.stringify(j))).catch(() => process.stdout.write("{}"));
            } catch {
              process.stdout.write("{}");
            }
          ')"
          RBE_ENDPOINT="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).endpoint || "")' <<<"$SETUP_JSON")"
          RBE_INSTANCE="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).instanceName || "")' <<<"$SETUP_JSON")"

          env -C /tmp/lim-ws lim gradle run \
            --id "$SANDBOX_ID" \
            --no-sync \
            --timeout 3600 \
            --env "UPSTREAM_REPO=$UPSTREAM_REPO" \
            --env "UPSTREAM_REF=$UPSTREAM_REF" \
            -- bash -ce '
              mkdir -p "$HOME/.local/bin"
              export PATH="$HOME/.local/bin:$PATH"
              if ! command -v bazelisk >/dev/null 2>&1; then
                curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64 -o "$HOME/.local/bin/bazelisk"
                chmod +x "$HOME/.local/bin/bazelisk"
                ln -sfn "$HOME/.local/bin/bazelisk" "$HOME/.local/bin/bazel"
              fi
              GIT_LFS_SKIP_SMUDGE=1 git clone --no-checkout "$UPSTREAM_REPO" /tmp/LiteRT-LM
              git -C /tmp/LiteRT-LM fetch --depth 1 origin "$UPSTREAM_REF"
              GIT_LFS_SKIP_SMUDGE=1 git -C /tmp/LiteRT-LM checkout -f FETCH_HEAD
              git -C /tmp/LiteRT-LM lfs pull --include="prebuilt/linux_x86_64/*"

              cat > /tmp/litert_glibc_compat.c <<'\''CEOF'\''
          long compat_strtol(const char *, char **, int);
          unsigned long compat_strtoul(const char *, char **, int);
          long long compat_strtoll(const char *, char **, int);
          unsigned long long compat_strtoull(const char *, char **, int);
          long long compat_strtoll_l(const char *, char **, int, void *);
          unsigned long long compat_strtoull_l(const char *, char **, int, void *);
          int compat_vsscanf(const char *, const char *, __builtin_va_list);
          double compat_fmod(double, double);
          float compat_fmodf(float, float);

          __asm__(".symver compat_strtol, strtol@GLIBC_2.2.5");
          __asm__(".symver compat_strtoul, strtoul@GLIBC_2.2.5");
          __asm__(".symver compat_strtoll, strtoll@GLIBC_2.2.5");
          __asm__(".symver compat_strtoull, strtoull@GLIBC_2.2.5");
          __asm__(".symver compat_strtoll_l, strtoll_l@GLIBC_2.3.3");
          __asm__(".symver compat_strtoull_l, strtoull_l@GLIBC_2.3.3");
          __asm__(".symver compat_vsscanf, vsscanf@GLIBC_2.2.5");
          __asm__(".symver compat_fmod, fmod@GLIBC_2.2.5");
          __asm__(".symver compat_fmodf, fmodf@GLIBC_2.2.5");

          __attribute__((visibility("hidden"))) long __isoc23_strtol(const char *n, char **e, int b) { return compat_strtol(n, e, b); }
          __attribute__((visibility("hidden"))) unsigned long __isoc23_strtoul(const char *n, char **e, int b) { return compat_strtoul(n, e, b); }
          __attribute__((visibility("hidden"))) long long __isoc23_strtoll(const char *n, char **e, int b) { return compat_strtoll(n, e, b); }
          __attribute__((visibility("hidden"))) unsigned long long __isoc23_strtoull(const char *n, char **e, int b) { return compat_strtoull(n, e, b); }
          __attribute__((visibility("hidden"))) long long __isoc23_strtoll_l(const char *n, char **e, int b, void *l) { return compat_strtoll_l(n, e, b, l); }
          __attribute__((visibility("hidden"))) unsigned long long __isoc23_strtoull_l(const char *n, char **e, int b, void *l) { return compat_strtoull_l(n, e, b, l); }
          __attribute__((visibility("hidden"))) int __isoc23_vsscanf(const char *s, const char *f, __builtin_va_list ap) { return compat_vsscanf(s, f, ap); }
          __attribute__((visibility("hidden"))) int __isoc23_sscanf(const char *s, const char *f, ...) {
            __builtin_va_list ap; __builtin_va_start(ap, f); int r = compat_vsscanf(s, f, ap); __builtin_va_end(ap); return r;
          }
          __attribute__((visibility("hidden"))) double fmod(double x, double y) { return compat_fmod(x, y); }
          __attribute__((visibility("hidden"))) float fmodf(float x, float y) { return compat_fmodf(x, y); }
          CEOF
              clang -O2 -fPIC -fno-builtin -c /tmp/litert_glibc_compat.c -o /tmp/litert_glibc_compat.o
              mkdir -p /tmp/static-cxx
              cp -f "$(clang++ -print-file-name=libstdc++.a)" /tmp/static-cxx/libstdc++.so
              ar rcs /tmp/static-cxx/libstdc++.so /tmp/litert_glibc_compat.o
            '

          env -C /tmp/lim-ws lim gradle run \
            --id "$SANDBOX_ID" \
            --no-sync \
            --timeout 4800 \
            --env "LIM_CACHE_TOKEN=$CACHE_TOKEN" \
            --env "RBE_ENDPOINT=$RBE_ENDPOINT" \
            --env "RBE_INSTANCE=$RBE_INSTANCE" \
            -- bash -ce '
              export PATH="$HOME/.local/bin:$PATH"
              CACHE_FLAGS=()
              if [ -n "${RBE_ENDPOINT:-}" ] && [ -n "${LIM_CACHE_TOKEN:-}" ]; then
                CACHE_FLAGS=(
                  --remote_cache="$RBE_ENDPOINT"
                  --remote_instance_name="$RBE_INSTANCE"
                  --remote_header="Authorization=Bearer $LIM_CACHE_TOKEN"
                  --remote_upload_local_results=true
                  --remote_cache_compression
                  --remote_download_all
                  --remote_local_fallback=true
                )
              fi
              env -C /tmp/LiteRT-LM bazelisk --output_user_root=/tmp/bazel-litert build \
                "${CACHE_FLAGS[@]}" \
                --repo_env=GIT_LFS_SKIP_SMUDGE=1 \
                --config=linux_x86_64 \
                --cxxopt=-std=c++20 \
                --host_cxxopt=-std=c++20 \
                --java_runtime_version=remotejdk_17 \
                --linkopt=/tmp/litert_glibc_compat.o \
                --linkopt=-L/tmp/static-cxx \
                --linkopt=-Wl,--exclude-libs,libstdc++.so:libstdc++.a \
                --linkopt=-Wl,--defsym=pidfd_spawnp=0 \
                --linkopt=-Wl,--defsym=pidfd_getpid=0 \
                --linkopt='\''-Wl,-rpath,$ORIGIN'\'' \
                --jobs=auto \
                //c:litert-lm
            '

          env -C /tmp/lim-ws lim gradle run \
            --id "$SANDBOX_ID" \
            --no-sync \
            --env "TAG=$TAG" \
            --env "COMMIT_SHA=$COMMIT_SHA" \
            --env "UPSTREAM_REF=$UPSTREAM_REF" \
            --env "REPO_SLUG=$GITHUB_REPOSITORY" \
            -- bash -ce '
              WORKSPACE_OUT="$PWD"
              rm -rf /tmp/litert-pkg
              mkdir -p /tmp/litert-pkg
              cp -L /tmp/LiteRT-LM/bazel-bin/c/liblitert-lm.so /tmp/litert-pkg/liblitert-lm.so
              for f in /tmp/LiteRT-LM/prebuilt/linux_x86_64/*.so; do
                [ -f "$f" ] && cp -L "$f" /tmp/litert-pkg/
              done
              (command -v patchelf >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y patchelf))
              for so in /tmp/litert-pkg/*.so; do
                chmod 0755 "$so"
                patchelf --set-rpath "\$ORIGIN" "$so"
              done
              ln -sfn liblitert-lm.so /tmp/litert-pkg/litert-lm.so
              cp -L /tmp/LiteRT-LM/LICENSE /tmp/litert-pkg/LICENSE
              cat > /tmp/litert-pkg/BUILD_INFO.json <<JSON
          {
            "repository": "${REPO_SLUG}",
            "tag": "${TAG}",
            "git_commit": "${COMMIT_SHA}",
            "upstream_repo": "google-ai-edge/LiteRT-LM",
            "upstream_sha": "${UPSTREAM_REF}",
            "target": "x86_64-unknown-linux-gnu"
          }
          JSON
              tar -czf "$WORKSPACE_OUT/litert-lm-out.tar.gz" -C /tmp/litert-pkg .
            '

          mkdir -p /tmp/pulled
          env -C /tmp/lim-ws lim gradle pull-file litert-lm-out.tar.gz /tmp/pulled/litert-lm-out.tar.gz --id "$SANDBOX_ID"

          ASSET_NAME="litert-lm-linux-x86_64-${SHORT_REF}.tar.gz"
          SHA_ASSET_NAME="${ASSET_NAME}.sha256"
          cp /tmp/pulled/litert-lm-out.tar.gz "/tmp/pulled/$ASSET_NAME"
          (cd /tmp/pulled && sha256sum "$ASSET_NAME" > "$SHA_ASSET_NAME")
          for target_name in "$ASSET_NAME" "$SHA_ASSET_NAME"; do
            for old_id in $(lim asset list --name "$target_name" --json 2>/dev/null | node -e '
              for (const item of JSON.parse(require("fs").readFileSync(0, "utf8") || "[]")) console.log(item.id);
            ' || true); do
              lim asset delete "$old_id" >/dev/null 2>&1 || true
            done
          done
          lim asset push "/tmp/pulled/$ASSET_NAME" -n "$ASSET_NAME" >/dev/null
          lim asset push "/tmp/pulled/$SHA_ASSET_NAME" -n "$SHA_ASSET_NAME" >/dev/null

      - name: Verify ELF portability, C API ABI coverage, and Cargo test suite
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify-native
          tar -xzf /tmp/pulled/litert-lm-out.tar.gz -C /tmp/verify-native

          readelf -d /tmp/verify-native/liblitert-lm.so | grep -E 'RPATH|RUNPATH' | grep -F '$ORIGIN'

          python3 - <<'PY'
          import glob, re, subprocess, sys

          for so in sorted(glob.glob("/tmp/verify-native/*.so")):
              out = subprocess.check_output(["objdump", "-T", so], text=True)
              versions = set()
              for m in re.finditer(r'GLIBC_(\d+)\.(\d+)(?:\.(\d+))?', out):
                  versions.add((int(m.group(1)), int(m.group(2)), int(m.group(3) or 0)))
              max_v = max(versions) if versions else (0, 0, 0)
              print(f"{so}: max GLIBC_{max_v[0]}.{max_v[1]}.{max_v[2]}")
              if max_v > (2, 36, 0):
                  sys.exit(f"GLIBC version too new in {so}: {max_v}")

          with open("src/bindings.rs") as f:
              want = sorted(set(re.findall(r'\blitert_lm_[a-z0-9_]+\b', f.read())))
          nm = subprocess.check_output(["nm", "-D", "--defined-only", "/tmp/verify-native/liblitert-lm.so"], text=True)
          have = {line.split()[-1].split("@")[0] for line in nm.splitlines() if line.strip()}
          missing = [s for s in want if s not in have]
          print(f"Verified {len(want) - len(missing)}/{len(want)} C API functions exported by liblitert-lm.so")
          if missing:
              sys.exit(f"Missing C API functions: {missing}")
          PY

          env -u LD_LIBRARY_PATH LITERT_LM_LIB_DIR=/tmp/verify-native cargo test --no-default-features
          env -u LD_LIBRARY_PATH LITERT_LM_LIB_DIR=/tmp/verify-native cargo build --examples --no-default-features

      - name: Stage Linux release artifacts, SHA-256 sidecars, and SPDX 2.3 SBOM
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          VERSION="${{ needs.meta.outputs.version }}"
          COMMIT_SHA="${{ needs.meta.outputs.commit_sha }}"
          UPSTREAM_REF="${{ needs.meta.outputs.upstream_ref }}"
          TARGET="x86_64-unknown-linux-gnu"
          ARCHIVE="litert-lm-${TAG}-${TARGET}.tar.gz"

          rm -rf dist
          mkdir -p dist
          cp /tmp/pulled/litert-lm-out.tar.gz "dist/${ARCHIVE}"
          cp /tmp/verify-native/liblitert-lm.so dist/liblitert-lm.so
          cp /tmp/verify-native/libGemmaModelConstraintProvider.so dist/libGemmaModelConstraintProvider.so
          cp /tmp/verify-native/libwebgpu_dawn.so dist/libwebgpu_dawn.so

          (
            cd dist
            for f in "${ARCHIVE}" liblitert-lm.so libGemmaModelConstraintProvider.so libwebgpu_dawn.so; do
              sha256sum "$f" > "${f}.sha256"
            done
          )

          node scripts/generate-sbom.mjs "$TAG" "$VERSION" "$TARGET" "$COMMIT_SHA" "$UPSTREAM_REF" \
            "$GITHUB_REPOSITORY" "x86_64" "linux" "liblitert-lm.so,libGemmaModelConstraintProvider.so,libwebgpu_dawn.so"

      - uses: actions/upload-artifact@v4
        with:
          name: release-x86_64-unknown-linux-gnu
          path: dist/*
          if-no-files-found: error

      - name: Delete ephemeral Limrun sandbox
        if: always() && steps.sandbox.outputs.id != ''
        env:
          LIM_API_KEY: ${{ secrets.LIM_API_KEY }}
        run: |
          lim gradle delete "${{ steps.sandbox.outputs.id }}" || true

  build-macos-arm64:
    needs: meta
    runs-on: macos-15
    timeout-minutes: 150
    env:
      ANDROID_NDK_HOME: ""
      ANDROID_NDK_ROOT: ""
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-macos-${{ needs.meta.outputs.upstream_ref }}
          restore-keys: |
            bazel-repo-macos-

      - name: Install Bazelisk and Limrun CLI
        env:
          LIM_API_KEY: ${{ secrets.LIM_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$HOME/.cache/bazel-repo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-darwin-arm64 -o "$HOME/.local/bin/bazelisk"
          chmod +x "$HOME/.local/bin/bazelisk"
          ln -sfn "$HOME/.local/bin/bazelisk" "$HOME/.local/bin/bazel"
          npm install -g lim --no-audit --no-fund
          if [[ -n "${LIM_API_KEY:-}" ]]; then
            lim set-api-key "$LIM_API_KEY" >/dev/null
            lim version
          fi
          git lfs install

      - name: Check Limrun Asset Storage for cached macOS archive
        id: cache_check
        env:
          LIM_API_KEY: ${{ secrets.LIM_API_KEY }}
        run: |
          set -euo pipefail
          UPSTREAM_REF="${{ needs.meta.outputs.upstream_ref }}"
          SHORT_REF="${UPSTREAM_REF:0:12}"
          FORCE_REBUILD="${{ needs.meta.outputs.force_rebuild }}"
          ASSET_NAME="litert-lm-macos-arm64-${SHORT_REF}.tar.gz"
          SHA_ASSET_NAME="${ASSET_NAME}.sha256"
          mkdir -p /tmp/pulled
          HIT="false"
          if [[ "$FORCE_REBUILD" != "true" && -n "${LIM_API_KEY:-}" ]]; then
            ASSET_ID="$(lim asset list --name "$ASSET_NAME" --json 2>/dev/null | node -e '
              const items = JSON.parse(require("fs").readFileSync(0, "utf8") || "[]");
              process.stdout.write(items[0]?.id || "");
            ' || true)"
            if [[ -n "$ASSET_ID" ]] && lim asset pull "$ASSET_ID" -o /tmp/pulled >/dev/null; then
              SHA_ID="$(lim asset list --name "$SHA_ASSET_NAME" --json 2>/dev/null | node -e '
                const items = JSON.parse(require("fs").readFileSync(0, "utf8") || "[]");
                process.stdout.write(items[0]?.id || "");
              ' || true)"
              VALID=1
              if [[ -n "$SHA_ID" ]] && lim asset pull "$SHA_ID" -o /tmp/pulled >/dev/null 2>&1; then
                EXPECTED="$(awk '{print tolower($1)}' "/tmp/pulled/$SHA_ASSET_NAME")"
                ACTUAL="$(shasum -a 256 "/tmp/pulled/$ASSET_NAME" | awk '{print $1}')"
                [[ "$EXPECTED" == "$ACTUAL" ]] || VALID=0
              fi
              if [[ "$VALID" -eq 1 ]]; then
                cp -f "/tmp/pulled/$ASSET_NAME" /tmp/pulled/litert-lm-out.tar.gz
                HIT="true"
                echo "Restored verified macOS archive from Limrun Asset Storage ($ASSET_NAME, $ASSET_ID)"
              fi
            fi
          fi
          echo "hit=${HIT}" >> "$GITHUB_OUTPUT"

      - name: Build macOS arm64 LiteRT-LM C API shared libraries (with Limrun RBE cache)
        if: steps.cache_check.outputs.hit != 'true'
        env:
          LIM_API_KEY: ${{ secrets.LIM_API_KEY }}
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          COMMIT_SHA="${{ needs.meta.outputs.commit_sha }}"
          UPSTREAM_REF="${{ needs.meta.outputs.upstream_ref }}"
          SHORT_REF="${UPSTREAM_REF:0:12}"

          CACHE_FLAGS=()
          if [[ -n "${LIM_API_KEY:-}" ]]; then
            CACHE_TOKEN="$(lim access-token create --permission 'remotecache:*:all' --permission 'remoteexecution:*:all' --ttl-seconds 7200 --quiet || true)"
            SETUP_JSON="$(node -e '
              try {
                const path = require("path"), cp = require("child_process");
                const limRoot = path.join(cp.execSync("npm root -g", { encoding: "utf8" }).trim(), "lim");
                const Limrun = require(path.join(limRoot, "node_modules/@limrun/api")).default;
                const { readConfig } = require(path.join(limRoot, "dist/lib/config"));
                const { getBazelSetup } = require(path.join(limRoot, "dist/lib/bazel-setup"));
                const cfg = readConfig();
                const client = new Limrun({ apiKey: cfg.apiKey, baseURL: cfg.apiEndpoint });
                getBazelSetup(client).then(j => process.stdout.write(JSON.stringify(j))).catch(() => process.stdout.write("{}"));
              } catch {
                process.stdout.write("{}");
              }
            ')"
            RBE_ENDPOINT="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).endpoint || "")' <<<"$SETUP_JSON")"
            RBE_INSTANCE="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).instanceName || "")' <<<"$SETUP_JSON")"
            if [[ -n "$RBE_ENDPOINT" && -n "$CACHE_TOKEN" ]]; then
              CACHE_FLAGS=(
                --remote_cache="$RBE_ENDPOINT"
                --remote_instance_name="$RBE_INSTANCE"
                --remote_header="Authorization=Bearer $CACHE_TOKEN"
                --remote_upload_local_results=true
                --remote_cache_compression
                --remote_download_all
                --remote_local_fallback=true
              )
            fi
          fi

          rm -rf /tmp/LiteRT-LM
          GIT_LFS_SKIP_SMUDGE=1 git clone --no-checkout "https://github.com/google-ai-edge/LiteRT-LM.git" /tmp/LiteRT-LM
          git -C /tmp/LiteRT-LM fetch --depth 1 origin "$UPSTREAM_REF"
          GIT_LFS_SKIP_SMUDGE=1 git -C /tmp/LiteRT-LM checkout -f FETCH_HEAD
          git -C /tmp/LiteRT-LM lfs pull --include="prebuilt/macos_arm64/*"

          env -C /tmp/LiteRT-LM bazelisk build \
            "${CACHE_FLAGS[@]}" \
            --repository_cache="$HOME/.cache/bazel-repo" \
            --repo_env=GIT_LFS_SKIP_SMUDGE=1 \
            --config=macos_arm64 \
            -c opt \
            //c:litert-lm

          rm -rf /tmp/litert-pkg /tmp/pulled
          mkdir -p /tmp/litert-pkg /tmp/pulled
          if [[ -f /tmp/LiteRT-LM/bazel-bin/c/liblitert-lm.dylib ]]; then
            cp -L /tmp/LiteRT-LM/bazel-bin/c/liblitert-lm.dylib /tmp/litert-pkg/liblitert-lm.dylib
          else
            cp -L /tmp/LiteRT-LM/bazel-bin/c/liblitert-lm.so /tmp/litert-pkg/liblitert-lm.dylib
          fi
          for f in /tmp/LiteRT-LM/prebuilt/macos_arm64/*.dylib; do
            [[ -f "$f" ]] && cp -L "$f" /tmp/litert-pkg/
          done
          chmod 0755 /tmp/litert-pkg/*.dylib

          python3 - <<'PY'
          import glob, os, subprocess

          dylibs = sorted(glob.glob("/tmp/litert-pkg/*.dylib"))
          basenames = {os.path.basename(p) for p in dylibs}
          for path in dylibs:
              base = os.path.basename(path)
              subprocess.check_call(["install_name_tool", "-id", f"@rpath/{base}", path])
              otool = subprocess.check_output(["otool", "-L", path], text=True).splitlines()[1:]
              for line in otool:
                  dep = line.strip().split(" (compatibility version")[0].strip()
                  dep_base = os.path.basename(dep)
                  if dep_base in basenames and dep != f"@rpath/{dep_base}":
                      subprocess.check_call(["install_name_tool", "-change", dep, f"@rpath/{dep_base}", path])
              rpaths = subprocess.check_output(["otool", "-l", path], text=True)
              if "@loader_path" not in rpaths:
                  subprocess.check_call(["install_name_tool", "-add_rpath", "@loader_path", path])
              subprocess.check_call(["codesign", "--force", "--sign", "-", path])
          PY

          ln -sfn liblitert-lm.dylib /tmp/litert-pkg/liblitert-lm.so
          cp -L /tmp/LiteRT-LM/LICENSE /tmp/litert-pkg/LICENSE
          cat > /tmp/litert-pkg/BUILD_INFO.json <<JSON
          {
            "repository": "${GITHUB_REPOSITORY}",
            "tag": "${TAG}",
            "git_commit": "${COMMIT_SHA}",
            "upstream_repo": "google-ai-edge/LiteRT-LM",
            "upstream_sha": "${UPSTREAM_REF}",
            "target": "aarch64-apple-darwin"
          }
          JSON
          tar -czf /tmp/pulled/litert-lm-out.tar.gz -C /tmp/litert-pkg .

          if [[ -n "${LIM_API_KEY:-}" ]]; then
            ASSET_NAME="litert-lm-macos-arm64-${SHORT_REF}.tar.gz"
            SHA_ASSET_NAME="${ASSET_NAME}.sha256"
            cp /tmp/pulled/litert-lm-out.tar.gz "/tmp/pulled/$ASSET_NAME"
            (cd /tmp/pulled && shasum -a 256 "$ASSET_NAME" > "$SHA_ASSET_NAME")
            for target_name in "$ASSET_NAME" "$SHA_ASSET_NAME"; do
              for old_id in $(lim asset list --name "$target_name" --json 2>/dev/null | node -e '
                for (const item of JSON.parse(require("fs").readFileSync(0, "utf8") || "[]")) console.log(item.id);
              ' || true); do
                lim asset delete "$old_id" >/dev/null 2>&1 || true
              done
            done
            lim asset push "/tmp/pulled/$ASSET_NAME" -n "$ASSET_NAME" >/dev/null
            lim asset push "/tmp/pulled/$SHA_ASSET_NAME" -n "$SHA_ASSET_NAME" >/dev/null
          fi

      - name: Verify Mach-O linkage, codesign, C API symbols, and Cargo test suite
        run: |
          set -euo pipefail
          rm -rf /tmp/verify-native
          mkdir -p /tmp/verify-native
          tar -xzf /tmp/pulled/litert-lm-out.tar.gz -C /tmp/verify-native

          otool -L /tmp/verify-native/liblitert-lm.dylib
          ! otool -L /tmp/verify-native/liblitert-lm.dylib | grep -q libLiteRt.dylib
          codesign --verify --verbose /tmp/verify-native/*.dylib

          python3 - <<'PY'
          import re, subprocess, sys
          with open("src/bindings.rs") as f:
              want = sorted(set(re.findall(r'\blitert_lm_[a-z0-9_]+\b', f.read())))
          nm = subprocess.check_output(["nm", "-gU", "/tmp/verify-native/liblitert-lm.dylib"], text=True)
          have = {line.split()[-1].lstrip("_") for line in nm.splitlines() if line.strip()}
          missing = [s for s in want if s not in have]
          print(f"Verified {len(want) - len(missing)}/{len(want)} C API functions exported by liblitert-lm.dylib")
          if missing:
              sys.exit(f"Missing C API functions: {missing}")
          PY

          env -u DYLD_LIBRARY_PATH LITERT_LM_LIB_DIR=/tmp/verify-native cargo test --no-default-features
          env -u DYLD_LIBRARY_PATH LITERT_LM_LIB_DIR=/tmp/verify-native cargo build --examples --no-default-features
          set +e
          OUT="$(env -u DYLD_LIBRARY_PATH ./target/debug/examples/text_chat 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          if echo "$OUT" | grep -qi "Library not loaded"; then
            echo "::error::macOS dyld failed to resolve dynamic libraries"
            exit 1
          fi
          test "$RC" -ne 134 -a "$RC" -ne 137

      - name: Stage macOS release artifacts, SHA-256 sidecars, and SPDX 2.3 SBOM
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          VERSION="${{ needs.meta.outputs.version }}"
          COMMIT_SHA="${{ needs.meta.outputs.commit_sha }}"
          UPSTREAM_REF="${{ needs.meta.outputs.upstream_ref }}"
          TARGET="aarch64-apple-darwin"
          ARCHIVE="litert-lm-${TAG}-${TARGET}.tar.gz"

          rm -rf dist
          mkdir -p dist
          cp /tmp/pulled/litert-lm-out.tar.gz "dist/${ARCHIVE}"
          cp /tmp/verify-native/liblitert-lm.dylib dist/liblitert-lm.dylib
          cp /tmp/verify-native/libGemmaModelConstraintProvider.dylib dist/libGemmaModelConstraintProvider.dylib
          cp /tmp/verify-native/libwebgpu_dawn.dylib dist/libwebgpu_dawn.dylib

          (
            cd dist
            for f in "${ARCHIVE}" liblitert-lm.dylib libGemmaModelConstraintProvider.dylib libwebgpu_dawn.dylib; do
              shasum -a 256 "$f" > "${f}.sha256"
            done
          )

          node scripts/generate-sbom.mjs "$TAG" "$VERSION" "$TARGET" "$COMMIT_SHA" "$UPSTREAM_REF" \
            "$GITHUB_REPOSITORY" "aarch64" "macos" "liblitert-lm.dylib,libGemmaModelConstraintProvider.dylib,libwebgpu_dawn.dylib"

      - uses: actions/upload-artifact@v4
        with:
          name: release-aarch64-apple-darwin
          path: dist/*
          if-no-files-found: error

  build-windows-x86_64:
    needs: meta
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      ANDROID_NDK_HOME: ""
      ANDROID_NDK_ROOT: ""
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
      BAZEL_SH: "C:/Program Files/Git/bin/bash.exe"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Restore Bazel repository cache
        id: bazel_repo_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/bazel-repo-cache
          key: bazel-repo-windows-${{ needs.meta.outputs.upstream_ref }}
          restore-keys: |
            bazel-repo-windows-

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Setup MSVC x64 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: "Configure Windows Long Paths, Developer Mode symlinks, MSYS2 bash, and short workspace"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name 'AllowDevelopmentWithoutDevLicense' -Value 1 -Type DWord
          git config --system core.longpaths true
          git lfs install

          # Win32 CreateProcessW(NULL, "bash -c ...") in Bazel's JVM searches C:\Windows\System32
          # BEFORE PATH. Remove the inactive WSL launcher stub so Bazel repository rules resolve
          # Git for Windows MSYS2 bash + GNU sed/patch/grep.
          foreach ($stub in @(
            "$env:SystemRoot\System32\bash.exe",
            "$env:SystemRoot\SysWOW64\bash.exe",
            "$env:LOCALAPPDATA\Microsoft\WindowsApps\bash.exe",
            "$env:LOCALAPPDATA\Microsoft\WindowsApps\python3.exe"
          )) {
            if (Test-Path $stub) {
              & takeown.exe /F $stub /A | Out-Null
              & icacls.exe $stub /grant "*S-1-5-32-544:F" | Out-Null
              Remove-Item -Force $stub
              Write-Host "Removed stub: $stub"
            }
          }

          $pyExe = (Get-Command python.exe).Source
          $py3Exe = Join-Path (Split-Path $pyExe -Parent) "python3.exe"
          if (-not (Test-Path $py3Exe)) {
            Copy-Item $pyExe $py3Exe -Force
          }

          Add-Content -Path $env:GITHUB_PATH -Value "$env:ALLUSERSPROFILE\chocolatey\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\cmd"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\mingw64\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\usr\bin"

          $w = if (Test-Path "D:\") { "D:\w" } else { "C:\_w" }
          if (Test-Path $w) { Remove-Item -Recurse -Force $w }
          New-Item -ItemType Directory -Path "$w\t", "$w\b", "$w\pulled", "$HOME\bazel-repo-cache" -Force | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "WIN_WORK_ROOT=$w"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$w\t"
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$w\t"

      - name: Install Limrun CLI and check Asset Storage for cached Windows archive
        id: cache_check
        shell: pwsh
        env:
          LIM_API_KEY: ${{ secrets.LIM_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $w = $env:WIN_WORK_ROOT
          $upstreamRef = "${{ needs.meta.outputs.upstream_ref }}"
          $shortRef = $upstreamRef.Substring(0, 12)
          $forceRebuild = "${{ needs.meta.outputs.force_rebuild }}"
          $assetName = "litert-lm-windows-x86_64-$shortRef.tar.gz"
          $shaAssetName = "$assetName.sha256"

          npm install -g lim --no-audit --no-fund
          $hit = "false"
          if ($env:LIM_API_KEY) {
            lim set-api-key $env:LIM_API_KEY | Out-Null
            lim version
            if ($forceRebuild -ne "true") {
              $items = @(lim asset list --name $assetName --json | ConvertFrom-Json)
              if ($items.Count -gt 0 -and $items[0].id) {
                $assetId = $items[0].id
                lim asset pull $assetId -o "$w\pulled" | Out-Null
                if ($LASTEXITCODE -eq 0 -and (Test-Path "$w\pulled\$assetName")) {
                  $valid = $true
                  $shaItems = @(lim asset list --name $shaAssetName --json | ConvertFrom-Json)
                  if ($shaItems.Count -gt 0 -and $shaItems[0].id) {
                    lim asset pull $shaItems[0].id -o "$w\pulled" | Out-Null
                    if (Test-Path "$w\pulled\$shaAssetName") {
                      $expected = (Get-Content "$w\pulled\$shaAssetName" -Raw).Trim().Split()[0].ToLowerInvariant()
                      $actual = (Get-FileHash "$w\pulled\$assetName" -Algorithm SHA256).Hash.ToLowerInvariant()
                      if ($expected -ne $actual) { $valid = $false }
                    }
                  }
                  if ($valid) {
                    Copy-Item "$w\pulled\$assetName" "$w\pulled\litert-lm-out.tar.gz" -Force
                    $hit = "true"
                    Write-Host "Restored verified Windows archive from Limrun Asset Storage ($assetName, $assetId)"
                  }
                }
              }
            }
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "hit=$hit"

      - name: Patch MSVC Linker for Long Paths and install build tools
        if: steps.cache_check.outputs.hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install make pkgconfiglite --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "choco install failed" }
          python -m pip install --quiet numpy
          if ($LASTEXITCODE -ne 0) { throw "pip install numpy failed" }

          $w = $env:WIN_WORK_ROOT
          $vcRoot = if ($env:BAZEL_VC) { $env:BAZEL_VC } else { "C:\Program Files\Microsoft Visual Studio\2022\*\VC" }
          $linkPath = (Get-ChildItem -Path "$vcRoot\Tools\MSVC\*\bin\HostX64\x64\link.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $linkPath) {
            $linkPath = (Get-Command link.exe).Source
          }
          $manifestPath = "$w\t\longpath.manifest"
          python scripts\win-helper.py write-manifest $manifestPath
          if ($LASTEXITCODE -ne 0) { throw "Failed to write longPathAware manifest" }
          $mtExe = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\mt.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $mtExe) { throw "Could not locate Windows SDK mt.exe" }
          & $mtExe -nologo -manifest $manifestPath -outputresource:"$linkPath`;1"
          if ($LASTEXITCODE -ne 0) { throw "mt.exe failed to patch MSVC link.exe" }

      - name: Build Windows x86_64 LiteRT-LM C API DLL & import library (with Limrun RBE cache)
        if: steps.cache_check.outputs.hit != 'true'
        shell: pwsh
        env:
          LIM_API_KEY: ${{ secrets.LIM_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $w = $env:WIN_WORK_ROOT
          $tag = "${{ needs.meta.outputs.tag }}"
          $commitSha = "${{ needs.meta.outputs.commit_sha }}"
          $upstreamRef = "${{ needs.meta.outputs.upstream_ref }}"
          $shortRef = $upstreamRef.Substring(0, 12)
          $repoCache = "$HOME\bazel-repo-cache" -replace '\\', '/'

          $gitTools = "C:\Program Files\Git\usr\bin;C:\Program Files\Git\bin;C:\Program Files\Git\mingw64\bin;C:\Program Files\Git\cmd"
          $env:PATH = "$gitTools;$env:PATH"
          # Verify Win32 CreateProcessW(NULL, "bash -c ...") directly (same search order as Bazel JVM)
          python -c "import subprocess, sys; r = subprocess.run(['bash', '-c', 'which bash sed patch grep tr awk && sed --version | head -n 1'], capture_output=True, text=True); print(r.stdout); sys.stderr.write(r.stderr); sys.exit(r.returncode)"
          if ($LASTEXITCODE -ne 0) { throw "Win32 CreateProcessW('bash') POSIX tool check failed" }

          $cacheFlags = @()
          if ($env:LIM_API_KEY) {
            $cacheToken = (lim access-token create --permission 'remotecache:*:all' --permission 'remoteexecution:*:all' --ttl-seconds 7200 --quiet)
            $setupJson = node -e 'try { const path = require("path"), cp = require("child_process"); const limRoot = path.join(cp.execSync("npm root -g", { encoding: "utf8" }).trim(), "lim"); const Limrun = require(path.join(limRoot, "node_modules/@limrun/api")).default; const { readConfig } = require(path.join(limRoot, "dist/lib/config")); const { getBazelSetup } = require(path.join(limRoot, "dist/lib/bazel-setup")); const cfg = readConfig(); const client = new Limrun({ apiKey: cfg.apiKey, baseURL: cfg.apiEndpoint }); getBazelSetup(client).then(j => process.stdout.write(JSON.stringify(j))).catch(() => process.stdout.write("{}")); } catch { process.stdout.write("{}"); }'
            $setup = $setupJson | ConvertFrom-Json
            if ($setup.endpoint -and $cacheToken) {
              Write-Host "Using Limrun RBE remote cache: $($setup.endpoint)"
              $cacheFlags = @(
                "--remote_cache=$($setup.endpoint)",
                "--remote_instance_name=$($setup.instanceName)",
                "--remote_header=Authorization=Bearer $cacheToken",
                "--remote_upload_local_results=true",
                "--remote_cache_compression",
                "--remote_download_all",
                "--remote_local_fallback=true"
              )
            }
          }

          $env:GIT_LFS_SKIP_SMUDGE = "1"
          git clone --no-checkout "https://github.com/google-ai-edge/LiteRT-LM.git" "$w\s"
          if ($LASTEXITCODE -ne 0) { throw "git clone failed" }
          git -C "$w\s" fetch --depth 1 origin $upstreamRef
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git -C "$w\s" checkout -f FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }
          Remove-Item Env:GIT_LFS_SKIP_SMUDGE -ErrorAction SilentlyContinue
          git -C "$w\s" lfs pull --include="prebuilt/windows_x86_64/*"
          if ($LASTEXITCODE -ne 0) { throw "git lfs pull failed" }

          Push-Location "$w\s"
          try {
            & bazelisk --output_base="$w\b" build `
              @cacheFlags `
              --repository_cache="$repoCache" `
              --repo_env=GIT_LFS_SKIP_SMUDGE=1 `
              --deleted_packages=swift `
              --build_tag_filters=-nowindows `
              --action_env=TMP="$w\t" `
              --action_env=TEMP="$w\t" `
              //c:litert-lm
            if ($LASTEXITCODE -ne 0) { throw "Bazel build of //c:litert-lm failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          New-Item -ItemType Directory -Force -Path "$w\pkg", "$w\pulled" | Out-Null
          python scripts\win-helper.py stage-built-dll "$w\s\bazel-bin\c" "$w\pkg\litert-lm.dll"
          if ($LASTEXITCODE -ne 0) { throw "Failed to stage built litert-lm.dll" }
          Copy-Item "$w\s\prebuilt\windows_x86_64\libGemmaModelConstraintProvider.dll" "$w\pkg\libGemmaModelConstraintProvider.dll" -Force
          Copy-Item "$w\s\prebuilt\windows_x86_64\webgpu_dawn.dll" "$w\pkg\webgpu_dawn.dll" -Force
          Copy-Item "$w\s\LICENSE" "$w\pkg\LICENSE" -Force

          python scripts\win-helper.py make-import-lib "$w\pkg\litert-lm.dll" "$w\t\litert-lm.def" "$w\pkg\litert-lm.lib"
          if ($LASTEXITCODE -ne 0) { throw "Failed to generate import library litert-lm.lib" }
          Copy-Item "$w\pkg\litert-lm.lib" "$w\pkg\litert-lm.if.lib" -Force

          $buildInfo = @{
            repository = $env:GITHUB_REPOSITORY
            tag = $tag
            git_commit = $commitSha
            upstream_repo = "google-ai-edge/LiteRT-LM"
            upstream_sha = $upstreamRef
            target = "x86_64-pc-windows-msvc"
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText("$w\pkg\BUILD_INFO.json", $buildInfo + "`n")

          $bsdtar = "$env:SystemRoot\System32\tar.exe"
          & $bsdtar -czf "$w\pulled\litert-lm-out.tar.gz" -C "$w\pkg" .
          if ($LASTEXITCODE -ne 0) { throw "tar.exe failed" }

          if ($env:LIM_API_KEY) {
            $assetName = "litert-lm-windows-x86_64-$shortRef.tar.gz"
            $shaAssetName = "$assetName.sha256"
            Copy-Item "$w\pulled\litert-lm-out.tar.gz" "$w\pulled\$assetName" -Force
            $hash = (Get-FileHash "$w\pulled\$assetName" -Algorithm SHA256).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText("$w\pulled\$shaAssetName", "$hash  $assetName`n")
            foreach ($targetName in @($assetName, $shaAssetName)) {
              $existing = @(lim asset list --name $targetName --json | ConvertFrom-Json)
              foreach ($item in $existing) {
                if ($item.id) { lim asset delete $item.id | Out-Null }
              }
            }
            lim asset push "$w\pulled\$assetName" -n $assetName | Out-Null
            lim asset push "$w\pulled\$shaAssetName" -n $shaAssetName | Out-Null
          }

      - name: Save Bazel repository cache
        if: always() && steps.cache_check.outputs.hit != 'true' && steps.bazel_repo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/bazel-repo-cache
          key: bazel-repo-windows-${{ needs.meta.outputs.upstream_ref }}

      - name: Verify PE DLL exports, Cargo test suite, and zero-PATH DLL loading
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $w = $env:WIN_WORK_ROOT
          $bsdtar = "$env:SystemRoot\System32\tar.exe"
          New-Item -ItemType Directory -Force -Path "$w\verify" | Out-Null
          & $bsdtar -xzf "$w\pulled\litert-lm-out.tar.gz" -C "$w\verify"
          if ($LASTEXITCODE -ne 0) { throw "tar.exe extract failed" }

          python scripts\win-helper.py verify-exports "src\bindings.rs" "$w\verify\litert-lm.dll"
          if ($LASTEXITCODE -ne 0) { throw "C API symbol check failed" }

          $env:LITERT_LM_LIB_DIR = "$w\verify"
          cargo test --no-default-features
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }
          cargo build --examples --no-default-features
          if ($LASTEXITCODE -ne 0) { throw "cargo build --examples failed" }
          Remove-Item Env:LITERT_LM_LIB_DIR -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath ".\target\debug\examples\text_chat.exe" -NoNewWindow -Wait -PassThru
          Write-Host "text_chat.exe exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -eq -1073741515 -or $proc.ExitCode -eq -1073741511) {
            throw "Windows loader failed to resolve DLLs or entrypoints (exit code $($proc.ExitCode))"
          }

      - name: Stage Windows release artifacts, SHA-256 sidecars, and SPDX 2.3 SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $w = $env:WIN_WORK_ROOT
          $tag = "${{ needs.meta.outputs.tag }}"
          $version = "${{ needs.meta.outputs.version }}"
          $commitSha = "${{ needs.meta.outputs.commit_sha }}"
          $upstreamRef = "${{ needs.meta.outputs.upstream_ref }}"
          $target = "x86_64-pc-windows-msvc"
          $archive = "litert-lm-$tag-$target.tar.gz"

          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "$w\pulled\litert-lm-out.tar.gz" "dist\$archive"
          $files = @(
            "litert-lm.dll",
            "litert-lm.lib",
            "litert-lm.if.lib",
            "libGemmaModelConstraintProvider.dll",
            "webgpu_dawn.dll"
          )
          foreach ($f in $files) {
            Copy-Item "$w\verify\$f" "dist\$f"
          }
          foreach ($f in (@($archive) + $files)) {
            $h = (Get-FileHash "dist\$f" -Algorithm SHA256).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText("$PWD\dist\$f.sha256", "$h  $f`n")
          }

          node scripts\generate-sbom.mjs $tag $version $target $commitSha $upstreamRef $env:GITHUB_REPOSITORY "x86_64" "windows" ($files -join ",")
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: release-x86_64-pc-windows-msvc
          path: dist/*
          if-no-files-found: error

  attest-and-release:
    needs:
      - meta
      - build-linux-x86_64
      - build-macos-arm64
      - build-windows-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: release-publish-${{ needs.meta.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.commit_sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Download all platform release bundles
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Assemble unified SHA256SUMS.txt and verify all checksums
        run: |
          set -euo pipefail
          (
            cd dist
            LC_ALL=C sort -k2 *.sha256 > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          ls -lh dist/

      - name: Attest SLSA build provenance for all archives and native libraries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.so
            dist/*.dylib
            dist/*.dll
            dist/litert-lm.lib

      - name: Attest SPDX 2.3 SBOM (Linux x86_64)
        uses: actions/attest-sbom@v2
        with:
          subject-path: dist/litert-lm-${{ needs.meta.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz
          sbom-path: dist/litert-lm-${{ needs.meta.outputs.tag }}-x86_64-unknown-linux-gnu.spdx.json

      - name: Attest SPDX 2.3 SBOM (macOS arm64)
        uses: actions/attest-sbom@v2
        with:
          subject-path: dist/litert-lm-${{ needs.meta.outputs.tag }}-aarch64-apple-darwin.tar.gz
          sbom-path: dist/litert-lm-${{ needs.meta.outputs.tag }}-aarch64-apple-darwin.spdx.json

      - name: Attest SPDX 2.3 SBOM (Windows x86_64)
        uses: actions/attest-sbom@v2
        with:
          subject-path: dist/litert-lm-${{ needs.meta.outputs.tag }}-x86_64-pc-windows-msvc.tar.gz
          sbom-path: dist/litert-lm-${{ needs.meta.outputs.tag }}-x86_64-pc-windows-msvc.spdx.json

      - name: Generate release notes
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          VERSION="${{ needs.meta.outputs.version }}"
          UPSTREAM_REF="${{ needs.meta.outputs.upstream_ref }}"
          cat > release-notes.md <<EOF
          Prebuilt **LiteRT-LM C API v1.1.0** native shared libraries for \`litert-lm-rust\` \`${VERSION}\` across **Linux \`x86_64\`** (\`glibc >= 2.36\`), **macOS \`arm64\`** (Apple Silicon), and **Windows \`x86_64\`** (MSVC), built from [\`google-ai-edge/LiteRT-LM@${UPSTREAM_REF:0:12}\`](https://github.com/google-ai-edge/LiteRT-LM/commit/${UPSTREAM_REF}) with Limrun and attested with GitHub Sigstore OIDC SLSA v1.0 build provenance + SPDX 2.3 SBOMs.

          ### Cargo (automatic SHA-256-verified download on Linux, macOS, and Windows)

          \`\`\`toml
          [dependencies]
          litert-lm-rust = { git = "https://github.com/${GITHUB_REPOSITORY}", tag = "${TAG}" }
          \`\`\`

          ### Verify Provenance & SBOM

          \`\`\`bash
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            archive="litert-lm-${TAG}-\${target}.tar.gz"
            gh release download "${TAG}" --repo ${GITHUB_REPOSITORY} -p "\${archive}" -p "SHA256SUMS.txt" --clobber
            gh attestation verify "\${archive}" --repo ${GITHUB_REPOSITORY}
            gh attestation verify "\${archive}" --repo ${GITHUB_REPOSITORY} --predicate-type https://spdx.dev/Document/v2.3
          done
          \`\`\`

          ### SHA-256 Checksums

          \`\`\`text
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ needs.meta.outputs.commit_sha }}
          name: litert-lm-rust ${{ needs.meta.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: dist/*

      - name: Verify live GitHub Release, Sigstore attestations, and Cargo download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          mkdir -p /tmp/release-dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/release-dl --clobber
          (cd /tmp/release-dl && sha256sum -c SHA256SUMS.txt)

          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            archive="/tmp/release-dl/litert-lm-${TAG}-${target}.tar.gz"
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" --predicate-type https://spdx.dev/Document/v2.3
          done

          for f in /tmp/release-dl/liblitert-lm.so \
                   /tmp/release-dl/liblitert-lm.dylib \
                   /tmp/release-dl/litert-lm.dll \
                   /tmp/release-dl/litert-lm.lib \
                   /tmp/release-dl/litert-lm.if.lib; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done

          env -u LITERT_LM_LIB_DIR -u LD_LIBRARY_PATH \
            LITERT_LM_FORCE_DOWNLOAD=1 \
            LITERT_LM_RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            CARGO_TARGET_DIR=/tmp/cargo-public-e2e \
            cargo test
