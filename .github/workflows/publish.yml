name: Publish Crate

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install libclang for bindgen verification
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests (default download-native from GitHub Release)
        run: cargo test

      - name: Run tests (all features including bindgen)
        run: |
          export LIBCLANG_PATH="$(llvm-config --libdir)"
          cargo test --all-features

      - name: Build crate (release)
        run: cargo build --release

      - name: Verify package archive
        run: cargo package --allow-dirty

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::notice title=Skip crates.io publish::CARGO_REGISTRY_TOKEN is not configured; verified release build and package archive only."
            exit 0
          fi
          cargo publish